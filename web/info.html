<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Agents - Agent Info</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>PIXEL AGENTS</h1>
    <nav>
      <a href="/">Agents</a>
      <a href="/info.html" class="active">Info</a>
    </nav>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>Reference</span>
    </div>
  </header>

  <div class="info-grid" id="info-grid"></div>

  <script src="/js/renderer.js"></script>
  <script>
    const AGENTS = [
      {
        name: "sisyphus",
        displayName: "Sisyphus",
        role: "Orchestrator",
        description: "The main orchestrator and default agent. Delegates tasks to specialized agents and coordinates the overall workflow. When orchestrating, conducts like a maestro with a baton.",
      },
      {
        name: "oracle",
        displayName: "Oracle",
        role: "High-IQ Consultant",
        description: "A wise and mystical consultant providing deep insights and high-level analysis. Sees patterns others miss.",
      },
      {
        name: "librarian",
        displayName: "Librarian",
        role: "External Reference Search",
        description: "The bookish researcher who searches external references, documentation, and knowledge bases to find relevant information.",
      },
      {
        name: "explore",
        displayName: "Explore",
        role: "Codebase Scanner",
        description: "An adventurous scout who greps and scans the codebase to find files, patterns, and understand project structure.",
      },
      {
        name: "prometheus",
        displayName: "Prometheus",
        role: "Planning Agent",
        description: "The fire-bearer who creates detailed implementation plans. Illuminates the path forward with structured blueprints and strategies.",
      },
      {
        name: "metis",
        displayName: "Metis",
        role: "Pre-Planning Consultant",
        description: "A thoughtful analyst who finds hidden requirements and edge cases before planning begins. Questions assumptions and uncovers what others miss.",
      },
      {
        name: "momus",
        displayName: "Momus",
        role: "Plan Reviewer & Critic",
        description: "The discerning critic who reviews plans and implementations. Points out flaws, suggests improvements, and ensures quality.",
      },
      {
        name: "atlas",
        displayName: "Atlas",
        role: "Knowledge Base Builder",
        description: "The strong builder who creates and maintains hierarchical knowledge bases. Carries the weight of project understanding.",
      },
      {
        name: "hephaestus",
        displayName: "Hephaestus",
        role: "Code Craftsman",
        description: "The master craftsman who specializes in code generation. Forges high-quality implementations with precision and skill.",
      },
    ];

    let frame = 0;
    const canvases = [];

    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("info-grid");

      for (const agent of AGENTS) {
        const card = document.createElement("div");
        card.className = "info-card";

        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        canvas.style.imageRendering = "pixelated";
        canvases.push({ canvas, name: agent.name });

        const content = document.createElement("div");
        content.className = "info-card-content";

        const h3 = document.createElement("h3");
        const palette = window.PixelRenderer.getPalette(agent.name);
        h3.style.color = palette.shirt;
        h3.textContent = agent.displayName;

        const role = document.createElement("div");
        role.className = "role";
        role.textContent = agent.role;

        const desc = document.createElement("div");
        desc.className = "description";
        desc.textContent = agent.description;

        content.appendChild(h3);
        content.appendChild(role);
        content.appendChild(desc);

        card.appendChild(canvas);
        card.appendChild(content);
        grid.appendChild(card);
      }

      const spriteInterval = 1000 / 4;
      let lastUpdate = 0;

      function loop(ts) {
        if (ts - lastUpdate >= spriteInterval) {
          lastUpdate = ts;
          frame++;
          for (const { canvas, name } of canvases) {
            const ctx = canvas.getContext("2d");
            window.PixelRenderer.drawAgent(ctx, name, "standing", frame, canvas.width);
          }
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
